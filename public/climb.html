<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Climbing Radar</title>
<link rel="icon" type="image/x-icon" href="/public/favicon.ico">
<script src="https://telegram.org/js/telegram-web-app.js"></script>
<style>
  :root{
    --bg:#0b0f10; --panel:#131a1c; --line:#1f2b2e;
    --ink:#e8f1f2; --muted:#7f9298; --gold:#d8b46a;
    --lock:#5c6b70; --open:#4fd1a5; --warn:#e2725b;
  }
  *{box-sizing:border-box}
  html,body{margin:0;padding:0;background:var(--bg);color:var(--ink);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;}
  body{padding:16px;padding-bottom:calc(16px + env(safe-area-inset-bottom));}
  h1{font-size:15px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);
    font-weight:600;margin:0 0 14px;text-align:center}
  /* ---- the scope ---------------------------------------------------------
     Crag coordinates are PUBLIC on chain, so every blip is drawn at its real
     bearing and real distance. No hot/cold band: a band is for hidden things,
     and manufacturing vagueness over public data would be theatre.

     The rose ROTATES with the device when absolute orientation is available, so
     "up" is the way you are facing and a blip at the top means walk forward.
     North-up alone is not actionable on foot: you cannot use it without already
     knowing which way north is, which is the thing you wanted the compass for.
  ------------------------------------------------------------------------- */
  .scope{position:relative;width:min(84vw,320px);aspect-ratio:1;margin:0 auto 12px;
    border-radius:50%;background:
      radial-gradient(circle at 50% 50%, rgba(79,209,165,.06), transparent 62%),
      var(--panel);
    border:1px solid var(--line);overflow:hidden}
  .rose{position:absolute;inset:0;transition:transform .2s linear}
  .ring{position:absolute;border:1px solid var(--line);border-radius:50%;
    top:50%;left:50%;transform:translate(-50%,-50%)}
  .sweep{position:absolute;inset:0;border-radius:50%;
    background:conic-gradient(from 0deg, rgba(79,209,165,.20), transparent 28%);
    animation:spin 4s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  @media (prefers-reduced-motion:reduce){.sweep{animation:none;opacity:.25}}
  .me{position:absolute;top:50%;left:50%;width:9px;height:9px;margin:-4.5px 0 0 -4.5px;
    border-radius:50%;background:var(--gold);box-shadow:0 0 10px rgba(216,180,106,.8)}
  /* Fixed to the SCREEN, not the rose: it marks the way you are pointing. */
  .facing{position:absolute;top:3px;left:50%;transform:translateX(-50%);
    width:0;height:0;border-left:7px solid transparent;border-right:7px solid transparent;
    border-bottom:10px solid var(--gold);opacity:.85}
  .blip{position:absolute;width:12px;height:12px;margin:-6px 0 0 -6px;border-radius:50%}
  .blip.open{background:var(--open);box-shadow:0 0 10px rgba(79,209,165,.8)}
  .blip.lock{background:transparent;border:1.5px dashed var(--lock)}
  .blip.mine{background:transparent;border:1.5px solid var(--gold);
    box-shadow:0 0 8px rgba(216,180,106,.55)}
  .blip b{position:absolute;top:14px;left:50%;font-size:9px;font-weight:600;
    white-space:nowrap;color:var(--muted)}
  .edge{font-size:9px;color:var(--muted);position:absolute;letter-spacing:.1em}
  /* ---- walk-this-way ------------------------------------------------------ */
  .guide{display:flex;align-items:center;gap:14px;background:var(--panel);
    border:1px solid var(--line);border-radius:14px;padding:13px 14px;margin:0 0 12px}
  .arrow{width:52px;height:52px;flex:none;transition:transform .2s linear}
  .arrow svg{display:block}
  .guide .txt{flex:1;min-width:0}
  .guide .big{font-size:20px;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.15}
  .guide .sub{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.4}
  /* ---- list -------------------------------------------------------------- */
  .card{background:var(--panel);border:1px solid var(--line);border-radius:12px;
    padding:12px 14px;margin-bottom:10px;display:flex;align-items:center;gap:12px}
  .card .grow{flex:1;min-width:0}
  .card h2{margin:0;font-size:15px;font-weight:600}
  .card p{margin:3px 0 0;font-size:12px;color:var(--muted)}
  .dist{font-variant-numeric:tabular-nums;font-size:15px;font-weight:600;text-align:right}
  .dist small{display:block;font-size:10px;color:var(--muted);font-weight:400}
  .pill{font-size:10px;padding:2px 7px;border-radius:999px;letter-spacing:.06em;
    text-transform:uppercase}
  .pill.open{background:rgba(79,209,165,.14);color:var(--open)}
  .pill.lock{background:rgba(92,107,112,.18);color:var(--lock)}
  .pill.mine{background:rgba(216,180,106,.14);color:var(--gold)}
  .note{font-size:12px;color:var(--muted);text-align:center;line-height:1.55;margin:12px 0}
  .note.warn{color:var(--warn)}
  button.act{width:100%;padding:13px;border-radius:11px;border:1px solid var(--line);
    background:var(--panel);color:var(--ink);font-size:14px;font-weight:600}
</style>
</head>
<body>
<h1>Climbing Radar</h1>

<div class="scope" id="scope">
  <div class="sweep"></div>
  <div class="rose" id="rose">
    <div class="ring" style="width:33%;height:33%"></div>
    <div class="ring" style="width:66%;height:66%"></div>
    <div class="ring" style="width:99%;height:99%"></div>
    <div class="edge" style="top:6px;left:50%;transform:translateX(-50%)">N</div>
    <div class="edge" style="bottom:6px;left:50%;transform:translateX(-50%)">S</div>
    <div class="edge" style="left:6px;top:50%;transform:translateY(-50%)">W</div>
    <div class="edge" style="right:6px;top:50%;transform:translateY(-50%)">E</div>
  </div>
  <div class="me"></div>
  <div class="facing" id="facing" style="display:none"></div>
</div>

<div class="guide" id="guide" style="display:none">
  <div class="arrow" id="arrow">
    <svg width="52" height="52" viewBox="-26 -26 52 52" aria-hidden="true">
      <circle r="24" fill="none" stroke="#1f2b2e" stroke-width="1"/>
      <path d="M0 -17 L10 11 L0 4.5 L-10 11 Z" fill="#d8b46a"/>
    </svg>
  </div>
  <div class="txt">
    <div class="big" id="guideDist">&mdash;</div>
    <div class="sub" id="guideSub"></div>
  </div>
</div>

<div class="note" id="status">Starting&hellip;</div>
<div id="list"></div>
<div class="note" id="foot"></div>

<script>
(function(){
  "use strict";
  var tg = window.Telegram && window.Telegram.WebApp;
  var API = window.location.origin;
  var statusEl = document.getElementById('status');
  var listEl   = document.getElementById('list');
  var footEl   = document.getElementById('foot');
  var roseEl   = document.getElementById('rose');
  var facingEl = document.getElementById('facing');
  var guideEl  = document.getElementById('guide');
  var arrowEl  = document.getElementById('arrow');
  var gDist    = document.getElementById('guideDist');
  var gSub     = document.getElementById('guideSub');

  var crags = [], wallet = null, fix = null, scale = 2000;
  var heading = null;          // degrees clockwise from magnetic north; null = unknown
  var headingSource = null;    // 'compass' | 'movement'
  var accuracyM = null;

  function say(msg, warn){ statusEl.textContent = msg; statusEl.className = warn ? 'note warn' : 'note'; }

  function distance(a, b){
    var R=6371000, t=Math.PI/180;
    var dLat=(b.lat-a.lat)*t, dLon=(b.lon-a.lon)*t;
    var la=a.lat*t, lb=b.lat*t;
    var h=Math.sin(dLat/2)*Math.sin(dLat/2)+Math.sin(dLon/2)*Math.sin(dLon/2)*Math.cos(la)*Math.cos(lb);
    return 2*R*Math.asin(Math.sqrt(h));
  }
  function bearing(a, b){
    var t=Math.PI/180;
    var la=a.lat*t, lb=b.lat*t, dLon=(b.lon-a.lon)*t;
    var y=Math.sin(dLon)*Math.cos(lb);
    var x=Math.cos(la)*Math.sin(lb)-Math.sin(la)*Math.cos(lb)*Math.cos(dLon);
    return (Math.atan2(y,x)*180/Math.PI+360)%360;
  }
  function human(m){
    if(m<1000) return Math.round(m)+' m';
    return (m/1000).toFixed(m<10000?1:0)+' km';
  }
  function compass(b){ return ['N','NE','E','SE','S','SW','W','NW'][Math.round(b/45)%8]; }
  function norm(d){ return ((d % 360) + 360) % 360; }
  function escapeHtml(s){
    return String(s==null?'':s).replace(/[&<>"']/g,function(ch){
      return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[ch];
    });
  }

  function applyRotation(){
    // A blip is placed at its ABSOLUTE bearing inside the rose. Rotating the
    // rose by -heading lands it at screen angle (bearing - heading), so the
    // direction you are facing ends up at the top. Do not also subtract the
    // heading per blip or the rotation is applied twice.
    roseEl.style.transform = (heading==null) ? 'rotate(0deg)' : 'rotate(' + (-heading) + 'deg)';
    facingEl.style.display = (heading==null) ? 'none' : 'block';
  }

  function draw(){
    Array.prototype.slice.call(roseEl.querySelectorAll('.blip')).forEach(function(n){ n.remove(); });

    if(!crags.length){
      listEl.innerHTML = '<div class="note">No active crags yet. Create one with /buildaclimb.</div>';
      footEl.textContent = ''; guideEl.style.display = 'none';
      return;
    }
    if(!fix){
      listEl.innerHTML = '<div class="note">Waiting for your location&hellip;</div>';
      footEl.textContent = ''; guideEl.style.display = 'none';
      return;
    }

    var mineCount = 0;
    var withGeo = crags.map(function(c){
      var mine = !!(wallet && c.creator &&
                    wallet.toLowerCase() === String(c.creator).toLowerCase());
      if(mine) mineCount++;
      return { c:c, mine:mine, d:distance(fix,c), b:bearing(fix,c) };
    }).sort(function(p,q){ return p.d-q.d; });

    scale = Math.max(200, withGeo[withGeo.length-1].d * 1.25);

    withGeo.forEach(function(g){
      var r = Math.min(g.d/scale, 1) * 44;
      var rad = (g.b-90) * Math.PI/180;
      var el = document.createElement('div');
      el.className = 'blip ' + (g.mine ? 'mine' : g.c.purchased ? 'open' : 'lock');
      el.style.left = (50 + r*Math.cos(rad)) + '%';
      el.style.top  = (50 + r*Math.sin(rad)) + '%';
      // Counter-rotate the label so it stays upright as the rose turns.
      var lbl = document.createElement('b');
      lbl.textContent = String(g.c.name).slice(0,12);
      lbl.style.transform = 'translateX(-50%) rotate(' + (heading==null?0:heading) + 'deg)';
      el.appendChild(lbl);
      roseEl.appendChild(el);
    });

    // --- explicit "walk this way" for the nearest crag ----------------------
    var near = withGeo[0];
    guideEl.style.display = 'flex';
    gDist.textContent = human(near.d) + ' · ' + near.c.name;
    if(heading == null){
      // With no heading an arrow would be a lie. Point it at the bearing and
      // say plainly that it is relative to north, not to you.
      arrowEl.style.transform = 'rotate(' + near.b + 'deg)';
      gSub.textContent = 'Bearing ' + Math.round(near.b) + '° ' + compass(near.b)
        + ' — no compass on this device, arrow points relative to north';
    } else {
      arrowEl.style.transform = 'rotate(' + norm(near.b - heading) + 'deg)';
      gSub.textContent = (headingSource === 'movement'
        ? 'Heading from your movement · '
        : 'Walk toward the arrow · ')
        + Math.round(near.b) + '° ' + compass(near.b);
    }

    listEl.innerHTML = withGeo.map(function(g){
      return '<div class="card">'
        + '<div class="grow"><h2>' + escapeHtml(g.c.name) + '</h2>'
        + '<p>' + escapeHtml(g.c.difficulty||'—') + ' · '
        + '<span class="pill ' + (g.mine?'mine':g.c.purchased?'open':'lock') + '">'
        + (g.mine?'yours':g.c.purchased?'unlocked':'locked') + '</span></p></div>'
        + '<div class="dist">' + human(g.d) + '<small>' + compass(g.b) + '</small></div>'
        + '</div>';
    }).join('');

    footEl.textContent = 'Rim ≈ ' + human(scale) + '. '
      + (mineCount
          ? 'Crags marked yours are ones you created — the contract does not let a creator buy their own.'
          : 'Locked crags still show — the map is free, access is not.');
  }

  function loadState(){
    var initData = (tg && tg.initData) || '';
    if(!initData){
      say('Open this from the bot — it needs Telegram to identify you.', true);
      return Promise.resolve();
    }
    return fetch(API + '/api/miniapp/state', {
      method:'POST', headers:{'Content-Type':'application/json'},
      body: JSON.stringify({ initData: initData })
    }).then(function(r){
      if(!r.ok) throw new Error('HTTP ' + r.status);
      return r.json();
    }).then(function(d){
      wallet = d.wallet; crags = d.crags || [];
      draw();
    }).catch(function(e){ say('Could not load crags: ' + e.message, true); });
  }

  function statusLine(){
    var bits = [wallet ? wallet.slice(0,6) + '…' + wallet.slice(-4) : 'no wallet linked'];
    // Accuracy is SHOWN, not hidden. A 2km fix and a 5m fix give very different
    // distances, and without the number a coarse fix just looks like a bug.
    if(accuracyM != null) bits.push('±' + Math.round(accuracyM) + ' m');
    bits.push(heading == null ? 'no compass'
            : headingSource === 'movement' ? 'heading from movement' : 'compass on');
    say('Tracking · ' + bits.join(' · '));
  }

  /* --- position -----------------------------------------------------------
     getLocation is one-shot, so this polls.
  ------------------------------------------------------------------------ */
  var POLL_MS = 4000;
  function readPosition(){
    if(!tg || !tg.LocationManager) return;
    tg.LocationManager.getLocation(function(loc){
      if(!loc){
        say('Location access denied. Tap below to allow it.', true);
        showSettings();
        return;
      }
      fix = { lat: loc.latitude, lon: loc.longitude };
      accuracyM = (typeof loc.horizontal_accuracy === 'number') ? loc.horizontal_accuracy : null;
      // `course` is the direction of TRAVEL and only exists while actually
      // moving. It is a fallback for a missing compass, never a replacement:
      // it tells you where you WERE going, not where you are pointing.
      if(headingSource !== 'compass' && typeof loc.course === 'number' && loc.course >= 0){
        heading = loc.course; headingSource = 'movement'; applyRotation();
      }
      statusLine();
      draw();
    });
  }
  function showSettings(){
    if(document.getElementById('settingsBtn')) return;
    var b=document.createElement('button');
    b.className='act'; b.id='settingsBtn'; b.textContent='Open location settings';
    b.onclick=function(){ tg.LocationManager.openSettings(); };
    footEl.parentNode.insertBefore(b, footEl);
  }

  /* --- compass ------------------------------------------------------------
     need_absolute asks for orientation relative to MAGNETIC NORTH, the only
     kind a compass can use. Some devices ignore it and return relative data
     anyway, so `absolute` is checked rather than assumed — a relative heading
     dressed up as "walk this way" would point confidently at nothing.
  ------------------------------------------------------------------------ */
  function startCompass(){
    var d = tg && tg.DeviceOrientation;
    if(!d || !d.start || !tg.onEvent) return;
    tg.onEvent('deviceOrientationChanged', function(){
      if(typeof d.alpha !== 'number') return;
      if(!d.absolute){
        // Relative only. Leave whatever the movement fallback gave us.
        return;
      }
      // alpha is RADIANS (per the Bot API docs) and increases anticlockwise
      // from north, so the direction the top of the device points is 360-alpha.
      heading = norm(360 - (d.alpha * 180 / Math.PI));
      headingSource = 'compass';
      applyRotation();
      statusLine();
      draw();
    });
    tg.onEvent('deviceOrientationFailed', function(){
      if(headingSource === 'compass'){ heading = null; headingSource = null; applyRotation(); }
      statusLine();
    });
    try { d.start({ refresh_rate: 200, need_absolute: true }); } catch(e){}
  }

  function start(){
    if(!tg){
      say('This page is a Telegram Mini App. Open it from the bot with /miniapp.', true);
      return;
    }
    tg.ready(); tg.expand();
    if(tg.setHeaderColor){ try { tg.setHeaderColor('#0b0f10'); } catch(e){} }

    loadState();
    startCompass();

    if(!tg.LocationManager){
      say('This Telegram version has no location support — update Telegram to use the radar.', true);
      return;
    }
    tg.LocationManager.init(function(){
      if(!tg.LocationManager.isLocationAvailable){
        say('Location services are unavailable on this device.', true);
        return;
      }
      readPosition();
      setInterval(readPosition, POLL_MS);
    });
    setInterval(loadState, 60000);
  }

  start();
})();
</script>
</body>
</html>
